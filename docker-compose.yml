services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lumenx
      POSTGRES_USER: lumenx
      # Development-only password: can be overridden with the POSTGRES_PASSWORD environment variable.
      # Avoid ';' and spaces in the password (it ends up in a connection string).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumenx_dev_password}
    ports:
      # Exposed only on the machine's localhost, not on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - lumenx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumenx -d lumenx"]
      interval: 5s
      timeout: 3s
      retries: 12

  forecasting:
    build: ./services/forecasting
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      args:
        # Same major version as PackagesMajor in backend/Directory.Build.props
        DOTNET_MAJOR: ${DOTNET_MAJOR:-10}
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=lumenx;Username=lumenx;Password=${POSTGRES_PASSWORD:-lumenx_dev_password}"
      Forecasting__BaseUrl: "http://forecasting:8000"
      Database__UseMigrations: "${DB_USE_MIGRATIONS:-false}"
      # Optional: without a key, explanations only use the template text.
      Gemini__ApiKey: "${GEMINI_API_KEY:-}"
      Gemini__Model: "${GEMINI_MODEL:-gemini-3.6-flash}"
      Gemini__TimeoutSeconds: "${GEMINI_TIMEOUT_SECONDS:-60}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      forecasting:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      args:
        # Same major version as PackagesMajor in dashboard/Directory.Build.props
        DOTNET_MAJOR: ${DOTNET_MAJOR:-10}
    environment:
      # Inside Docker's network the backend is called "backend" (the call comes from the dashboard server).
      Backend__BaseUrl: "http://backend:8080"
    ports:
      - "8081:8080"
    depends_on:
      - backend

volumes:
  lumenx_pgdata:
