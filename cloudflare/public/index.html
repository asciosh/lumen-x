<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1117">
<meta name="robots" content="noindex">
<title>Lumen-X</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  .topbar { justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .topbar .left, .topbar .right { display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; }
  .toggle { display: inline-flex; padding: 3px; gap: 2px; background: var(--ink-0); border: 1px solid var(--line); border-radius: 999px; }
  .toggle button { font: inherit; font-size: 0.88rem; padding: 0.3rem 0.85rem; border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; }
  .toggle button.on { background: var(--amber); color: #1a1204; font-weight: 650; }
  .who { color: var(--amber-soft); font-size: 0.92rem; }
  .btn-small { min-height: 2rem; padding: 0.25rem 0.8rem; font-size: 0.9rem; }
  .btn-link { display: inline-flex; align-items: center; text-decoration: none; }
  .product-list { list-style: none; margin: 0 0 1.5rem; padding: 0; display: grid; gap: 0.6rem; }
  .product-list a { display: flex; justify-content: space-between; gap: 1rem; padding: 0.85rem 1.1rem; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--ink-2); text-decoration: none; color: var(--cream); }
  .product-list a:hover { border-color: var(--amber); }
  .product-list .meta { color: var(--muted); font-size: 0.88rem; }
  .card + .card, .card + p { margin-top: 1.25rem; }
  .alert-warn { color: var(--amber-soft); background: rgba(252, 187, 71, 0.07); border-color: var(--amber); }
  details.fold { margin: 0.5rem 0 1rem; }
  .danger { color: var(--err); border-color: var(--err); }
  .hint { max-width: 70ch; }
  .summary-grid { display: grid; gap: 1rem; grid-template-columns: 1fr; margin-top: 0.75rem; }
  @media (min-width: 860px) { .summary-grid { grid-template-columns: 1.35fr 1fr; } .block.order { grid-row: span 2; } }
  .block { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 1rem 1.15rem; background: var(--ink-2); }
  .stage .block h3, .block h3 { margin: 0 0 0.5rem; padding-top: 0; border-top: 0; font-size: 0.95rem; font-weight: 650; color: var(--muted); }
  .block details.fold h3 { margin: 0; }
  #order-form { margin: 0.9rem 0 0.4rem; }
  #order-form label { flex: 0 0 auto; }
  .block.order { border-color: var(--amber); background: rgba(252, 187, 71, 0.06); }
  .block p { margin: 0.35rem 0; }
  .kicker { color: var(--muted); font-size: 0.95rem; margin-bottom: 0 !important; }
  .bignum { font-family: var(--font-display, inherit); font-size: clamp(1.9rem, 5vw, 2.7rem); font-weight: 700; color: var(--amber); line-height: 1.1; margin: 0.1rem 0 0.3rem !important; }
  .bignum span { font-size: 0.45em; font-weight: 600; color: var(--amber-soft); }
  .small { font-size: 0.88rem; }
  .badge { display: inline-block; padding: 0.2rem 0.75rem; border-radius: 999px; font-size: 0.92rem; font-weight: 650; border: 1px solid transparent; }
  .badge.high { color: #8be0a6; background: rgba(139, 224, 166, 0.12); border-color: rgba(139, 224, 166, 0.35); }
  .badge.medium { color: #d6e283; background: rgba(214, 226, 131, 0.12); border-color: rgba(214, 226, 131, 0.35); }
  .badge.low { color: var(--amber); background: rgba(252, 187, 71, 0.12); border-color: rgba(252, 187, 71, 0.4); }
  .badge.very_low { color: #ff9a8a; background: rgba(255, 154, 138, 0.12); border-color: rgba(255, 154, 138, 0.4); }
  details.expert > summary h2 { font-size: 1.15rem; }
  .chart .hit { fill: transparent; stroke: none; }
  .chart .hit:hover { fill: rgba(252, 187, 71, 0.35); }
</style>
</head>
<body>
<header class="topbar">
  <div class="left">
    <a class="brand" href="#/" aria-label="Lumen-X">
      <svg class="brand-mark" viewBox="0 0 38 24" aria-hidden="true"><path class="m-line" d="M1.5 17 C5 6 8.5 20 13 12 S20 5 24 11"/><circle class="m-dot" cx="24" cy="11" r="3.2"/><path class="m-dash" d="M29 9 C31 5 33.5 11 36.5 4"/></svg>
      Lumen-X
    </a>
    <span class="tagline" id="tagline"></span>
  </div>
  <div class="right">
    <span class="who" id="who" hidden></span>
    <button id="signout" class="btn btn-secondary btn-small" type="button" hidden></button>
    <span class="toggle" role="group" aria-label="Language">
      <button id="btn-en" type="button" class="on">EN</button><button id="btn-it" type="button">IT</button>
    </span>
  </div>
</header>

<main class="content" id="content"><p class="muted">Loading…</p></main>
<footer class="footer" id="footer"></footer>

<noscript><p style="padding:2rem">Lumen-X needs JavaScript.</p></noscript>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>
