<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen-X</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f1117; color: #fef4e2; margin: 0; padding: 3rem 1.25rem; }
  main { max-width: 38rem; margin: 0 auto; }
  h1 { color: #fcbb47; margin: 0 0 .25rem; }
  p { line-height: 1.5; }
  .muted { color: #b8ad98; }
  .ok { color: #fcd479; }
</style>
</head>
<body>
<main>
  <h1>Lumen-X</h1>
  <p class="muted">Cloudflare edition: the dashboard is coming. This page only checks that the login and the API work.</p>
  <p id="who">Checking the login…</p>
  <p id="products" class="muted"></p>
</main>
<script>
  async function check() {
    const who = document.getElementById('who');
    const products = document.getElementById('products');
    try {
      const me = await fetch('/api/me');
      if (!me.ok) throw new Error('HTTP ' + me.status);
      const data = await me.json();
      who.textContent = 'Signed in as ' + data.email + '.';
      who.className = 'ok';
      const list = await (await fetch('/api/products')).json();
      products.textContent = list.length === 0 ? 'You have no products yet.' : 'You have ' + list.length + ' product(s).';
    } catch (error) {
      who.textContent = 'The login or the API is not working yet (' + error.message + ').';
    }
  }
  check();
</script>
</body>
</html>
